<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diagrama de Venn Interativo — EaD</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>body{font-family:system-ui,-apple-system,sans-serif}.filter.active{outline:2px solid #fde68a;outline-offset:2px}canvas{touch-action:manipulation}</style>
</head>
<body class="bg-indigo-950 text-indigo-50 min-h-screen flex items-center justify-center p-4">
<main class="max-w-5xl w-full bg-indigo-900 rounded-2xl shadow-2xl p-6 border border-indigo-700">
<header class="text-center mb-6"><h1 class="text-2xl font-bold text-amber-300">Teoria dos Conjuntos na Educação</h1><p class="text-sm text-indigo-200 mt-1">Seleção de Plataformas de Ensino a Distância (EaD)</p></header>
<div class="grid grid-cols-1 md:grid-cols-3 gap-6 items-stretch">
<div class="md:col-span-2 flex flex-col items-center justify-center bg-indigo-950 rounded-xl p-4 shadow-inner border border-indigo-800"><canvas id="vennCanvas" width="450" height="380" class="cursor-pointer max-w-full h-auto" role="button" tabindex="0" aria-label="Diagrama interativo: clique em uma região para selecionar"></canvas><p class="text-xs text-indigo-300 mt-2">Universo U = 45 plataformas avaliadas · Clique em uma região</p></div>
<section class="bg-indigo-900 p-5 rounded-xl border border-indigo-700 flex flex-col justify-between shadow-md" aria-live="polite"><div><h2 id="regionTitle" class="text-lg font-bold text-amber-300 mb-2"></h2><p id="regionDesc" class="text-sm text-indigo-200 leading-relaxed"></p><p id="regionMath" class="text-xs text-indigo-300 mt-4"></p></div><div class="mt-6 pt-4 border-t border-indigo-800"><span class="text-xs font-semibold text-indigo-400 uppercase tracking-wider">Filtro ativo</span><p id="regionCount" class="text-sm font-medium text-amber-300 mt-1"></p></div></section>
</div>
<div id="filters" class="mt-6 grid grid-cols-2 sm:grid-cols-4 gap-2"></div>
<p class="text-xs text-indigo-300 mt-4 text-center">X = Acessibilidade · Y = Gamificação · Z = Avaliação adaptativa. Valores ilustrativos.</p>
</main>
<script>
const canvas=document.getElementById('vennCanvas'),ctx=canvas.getContext('2d');
const circles=[{id:'X',x:180,y:150,r:100,color:'#f59e0b'},{id:'Y',x:270,y:150,r:100,color:'#10b981'},{id:'Z',x:225,y:230,r:100,color:'#ef4444'}];
const regions={
 none:{title:'Fora dos conjuntos (U − (X ∪ Y ∪ Z))',desc:'Plataformas que não atendem a nenhum dos três critérios considerados.',math:'45 − 38 = 7',count:7},
 X:{title:'Somente X — Acessibilidade',desc:'Atendem ao critério de acessibilidade, mas não incluem gamificação nem avaliação adaptativa.',math:'X − (Y ∪ Z)',count:9},
 Y:{title:'Somente Y — Gamificação',desc:'Oferecem gamificação, mas não atendem aos outros dois critérios.',math:'Y − (X ∪ Z)',count:7},
 Z:{title:'Somente Z — Avaliação adaptativa',desc:'Oferecem avaliação adaptativa, sem atender aos critérios de acessibilidade e gamificação considerados.',math:'Z − (X ∪ Y)',count:6},
 XY:{title:'X ∩ Y, sem Z',desc:'Combinam acessibilidade e gamificação, mas não avaliação adaptativa.',math:'(X ∩ Y) − Z',count:5},
 XZ:{title:'X ∩ Z, sem Y',desc:'Combinam acessibilidade e avaliação adaptativa, sem gamificação.',math:'(X ∩ Z) − Y',count:4},
 YZ:{title:'Y ∩ Z, sem X',desc:'Combinam gamificação e avaliação adaptativa, sem atender ao critério de acessibilidade.',math:'(Y ∩ Z) − X',count:4},
 XYZ:{title:'Interseção total (X ∩ Y ∩ Z)',desc:'Atendem simultaneamente aos três critérios: acessibilidade, gamificação e avaliação adaptativa. São candidatas prioritárias para homologação.',math:'X ∩ Y ∩ Z',count:3},
 all:{title:'Visão geral dos conjuntos',desc:'O universo reúne as 45 plataformas avaliadas. Clique em uma região do desenho ou use os filtros abaixo para investigar os critérios.',math:'U = 45',count:45},
 union:{title:'União (X ∪ Y ∪ Z)',desc:'Plataformas que atendem a pelo menos um dos três critérios educacionais.',math:'9 + 7 + 6 + 5 + 4 + 4 + 3 = 38',count:38},
 difference:{title:'Diferença (X − Y)',desc:'Plataformas que atendem ao critério de acessibilidade, mas não ao de gamificação. Inclui as que também oferecem avaliação adaptativa.',math:'Somente X (9) + somente X ∩ Z (4) = 13',count:13}
};
const positions={X:[135,140],Y:[315,140],Z:[225,300],XY:[225,120],XZ:[165,210],YZ:[285,210],XYZ:[225,180],none:[385,55]};
const buttons=[['all','Ver tudo (U)'],['X','Somente X'],['Y','Somente Y'],['Z','Somente Z'],['XY','X ∩ Y (sem Z)'],['XZ','X ∩ Z (sem Y)'],['YZ','Y ∩ Z (sem X)'],['XYZ','Interseção total'],['union','União (X ∪ Y ∪ Z)'],['difference','Diferença (X − Y)'],['none','Fora dos conjuntos']];
let active='all';
function mask(x,y){return circles.map(c=>Math.hypot(x-c.x,y-c.y)<=c.r?c.id:'').join('')||'none'}
function selected(key){return active==='all'||active===key||(active==='union'&&key!=='none')||(active==='difference'&&(key==='X'||key==='XZ'))}
function draw(){ctx.clearRect(0,0,450,380);ctx.strokeStyle='#6366f1';ctx.lineWidth=2;ctx.strokeRect(10,10,430,360);ctx.font='12px system-ui';ctx.fillStyle='#a5b4fc';ctx.fillText('Universo U (45 plataformas EaD)',20,30);
// Pintura por pixel lógico: a seleção corresponde exatamente às regiões de sobreposição.
const off=document.createElement('canvas');off.width=450;off.height=380;const oc=off.getContext('2d');const img=oc.createImageData(450,380);const palette={X:[245,158,11],Y:[16,185,129],Z:[239,68,68],XY:[137,190,75],XZ:[242,112,83],YZ:[89,137,133],XYZ:[255,210,80]};
for(let y=11;y<369;y++)for(let x=11;x<439;x++){const key=mask(x+.5,y+.5);if(key==='none')continue;const i=(y*450+x)*4,p=palette[key],on=selected(key);img.data[i]=p[0];img.data[i+1]=p[1];img.data[i+2]=p[2];img.data[i+3]=on?205:35}oc.putImageData(img,0,0);ctx.drawImage(off,0,0);
circles.forEach(c=>{ctx.beginPath();ctx.arc(c.x,c.y,c.r,0,2*Math.PI);ctx.strokeStyle=c.color;ctx.lineWidth=2;ctx.stroke()});
for(const [key,[x,y]] of Object.entries(positions)){const on=selected(key);ctx.font='bold 14px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=on?'#fff':'#94a3b8';ctx.fillText(regions[key].count,x,y);if(active===key){ctx.beginPath();ctx.arc(x,y,13,0,2*Math.PI);ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke()}}ctx.textAlign='start';ctx.textBaseline='alphabetic';
}
function highlightRegion(key){if(!regions[key])return;active=key;const r=regions[key];document.getElementById('regionTitle').textContent=r.title;document.getElementById('regionDesc').textContent=r.desc;document.getElementById('regionMath').textContent='Expressão: '+r.math;document.getElementById('regionCount').textContent=`Quantidade: ${r.count} plataforma${r.count===1?'':'s'}.`;document.querySelectorAll('.filter').forEach(b=>{const on=b.dataset.key===key;b.classList.toggle('active',on);b.setAttribute('aria-pressed',String(on))});draw()}
const filters=document.getElementById('filters');buttons.forEach(([key,label])=>{const b=document.createElement('button');b.type='button';b.dataset.key=key;b.className='filter bg-indigo-800 hover:bg-indigo-700 text-indigo-50 font-medium text-xs py-2 px-3 rounded-lg transition border border-indigo-600';b.textContent=label;b.addEventListener('click',()=>highlightRegion(key));filters.appendChild(b)});
canvas.addEventListener('click',e=>{const rect=canvas.getBoundingClientRect(),x=(e.clientX-rect.left)*canvas.width/rect.width,y=(e.clientY-rect.top)*canvas.height/rect.height;if(x<10||x>440||y<10||y>370)return;highlightRegion(mask(x,y))});canvas.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();highlightRegion('all')}});
highlightRegion('all');
</script></body></html>
